        url: https://www.ppdeskcat.site/
        start_date: "2025.3"
        end_date: "2026.5"
        highlights:
          - "跨平台桌面 AI 伴侣应用，基于 Electron、React、TypeScript 构建，集成桌面宠物、AI 对话、专注提醒与工作时间线记录等功能。项目采用 local-first 设计，支持本地数据存储、API Key 安全管理、窗口状态感知等，共收获4000+阅读，300+用户。"

